name: Build TLauncher

on:
  push:
    branches: [main, codex/rust-dock, codex/unified-spotlight-v1.0.2, codex/fluidwin-integration-v1.0.3, codex/fluidwin-native-base-v1.0.3, codex/native-wallpaper-reengineering-v1.0.3, codex/native-stage-spotlight-reengineering-v1.0.3]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fluidwin-baseline:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact unmodified FluidWin reference
        uses: actions/checkout@v4
        with:
          repository: clooudfn/FluidWin
          ref: 2f773a8733b84c7dbee88fff6628d14e9ac802b9
          path: upstream-fluidwin
          persist-credentials: false
      - name: Reuse exact hosted upstream reference evidence
        id: baseline-cache
        uses: actions/cache@v4
        with:
          path: baseline-evidence
          key: fluidwin-phase0-2f773a8-v2-${{ hashFiles('tests/fluidwin-baseline.cpp','tests/fluidwin-baseline.rc','tests/upstream-runtime-smoke.ps1') }}
      - name: Install upstream toolchain on hosted runner
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc git
      - name: Build original application and exercise original renderer
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test "$(git -C upstream-fluidwin rev-parse HEAD)" = '2f773a8733b84c7dbee88fff6628d14e9ac802b9'
          mkdir -p baseline-evidence
          cd upstream-fluidwin
          windres icona.rc -O coff -o ../baseline-evidence/icona.o
          libs='-ld3d11 -ldxgi -ldcomp -ld3dcompiler -ld2d1 -ldwrite -ldwmapi -luser32 -lgdi32 -lshell32 -lole32 -loleaut32 -lversion -lpropsys -luuid -liphlpapi -lwindowscodecs -lruntimeobject -lpowrprof -lshlwapi -lshcore -lsetupapi -lwinmm -ldxva2 -lwinhttp -lcomdlg32 -lbcrypt'
          g++ -O2 -std=gnu++20 -Wall -municode -mwindows fluidwin.cpp ../baseline-evidence/icona.o -o ../baseline-evidence/FluidWin-reference.exe $libs -static
          cd ..
          windres -I tests tests/fluidwin-baseline.rc -O coff -o baseline-evidence/probe-manifest.o
          g++ -O2 -std=gnu++20 -DNOMINMAX -Iupstream-fluidwin tests/fluidwin-baseline.cpp baseline-evidence/probe-manifest.o -o baseline-evidence/baseline-probe.exe $libs -static
          ./baseline-evidence/baseline-probe.exe baseline-evidence
          git -C upstream-fluidwin diff --exit-code
          git -C upstream-fluidwin rev-parse HEAD > baseline-evidence/UPSTREAM-COMMIT.txt
          sha256sum baseline-evidence/FluidWin-reference.exe > baseline-evidence/FluidWin-reference.exe.sha256
      - name: Exercise untouched upstream startup, Launcher, Settings and Guardian
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tests/upstream-runtime-smoke.ps1 -Exe ./baseline-evidence/FluidWin-reference.exe -Evidence ./baseline-evidence
      - name: Upload internal upstream baseline (never owner TEST)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluidwin-reference-baseline
          path: baseline-evidence/
          retention-days: 14
          if-no-files-found: error
  native-base:
    permissions:
      contents: read
      actions: read
    needs: wallpaper-contract
    if: always() && (github.ref == 'refs/heads/codex/fluidwin-native-base-v1.0.3' || ((github.ref == 'refs/heads/codex/native-wallpaper-reengineering-v1.0.3' || github.ref == 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3') && needs.wallpaper-contract.result == 'success'))
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact hosted native build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-build
          key: native-base-ucrt64-unicode-v2-${{ hashFiles('native/fluidwin/*.h','native/fluidwin/fluidwin.cpp','native/fluidwin/icona.rc','native/fluidwin/icona.ico','native/fluidwin/sfondi/*.jpg','native/wallpaper/**','tests/native-base-contract.cpp','tests/native-phase3-contract.h','tests/clock-v102-reference.h','tests/wallpaper-accessibility.cpp','.github/workflows/build-rust-test.yml') }}
      - uses: msys2/setup-msys2@v2
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc git
      - name: Audit native source boundaries and provenance
        shell: pwsh
        run: |
          ./tests/native-source-audit.ps1
          ./tests/native-localization-contract.ps1
          ./tests/native-resource-summary.ps1
      - name: Compile complete upstream-based application and lifecycle contract
        id: native-compile
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p native-build native-evidence
          libs='-ld3d11 -ldxgi -ldcomp -ld3dcompiler -ld2d1 -ldwrite -ldwmapi -luser32 -lgdi32 -lshell32 -lole32 -loleaut32 -lversion -lpropsys -luuid -liphlpapi -lwindowscodecs -lruntimeobject -lpowrprof -lshlwapi -lshcore -lsetupapi -lwinmm -ldxva2 -lwinhttp -lcomdlg32 -lbcrypt -lopengl32 -lwtsapi32 -loleacc -lnormaliz -lpdh -lusp10'
          (cd native/fluidwin && windres icona.rc -O coff -o ../../native-build/icon.o)
          g++ -O2 -std=gnu++20 -Wall -municode -mwindows native/fluidwin/fluidwin.cpp native-build/icon.o -o native-build/TLauncher.exe $libs -static
          g++ -O2 -std=gnu++20 -Wall -DUNICODE -D_UNICODE tests/native-base-contract.cpp native-build/icon.o -o native-build/native-contract.exe $libs -static
          g++ -O2 -std=gnu++20 -Wall tests/wallpaper-accessibility.cpp -o native-build/wallpaper-accessibility.exe -loleacc -loleaut32 -lole32 -luuid -luser32 -static
          mkdir -p native-build/runtime-licenses
          for license_dir in /ucrt64/share/licenses/gcc* /ucrt64/share/licenses/libgcc* /ucrt64/share/licenses/libstdc++* /ucrt64/share/licenses/cc-libs* /ucrt64/share/licenses/libwinpthread* /ucrt64/share/licenses/mingw-w64*; do
            if [ -d "$license_dir" ]; then cp -r "$license_dir" native-build/runtime-licenses/; fi
          done
          test -n "$(ls -A native-build/runtime-licenses)"
      - name: Retain successful hosted compilation independently of runtime result
        if: ${{ !cancelled() && steps.native-compile.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: native-build
          key: native-base-ucrt64-unicode-v2-${{ hashFiles('native/fluidwin/*.h','native/fluidwin/fluidwin.cpp','native/fluidwin/icona.rc','native/fluidwin/icona.ico','native/fluidwin/sfondi/*.jpg','native/wallpaper/**','tests/native-base-contract.cpp','tests/native-phase3-contract.h','tests/clock-v102-reference.h','tests/wallpaper-accessibility.cpp','.github/workflows/build-rust-test.yml') }}
      - name: Verify real profile, Notch resources, native startup and Guardian recovery
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./tests/native-profile-migration.ps1 -NativeContract (Resolve-Path native-build/native-contract.exe).Path -Evidence (Resolve-Path native-evidence).Path | Tee-Object native-evidence/profile-migration.txt
          $profile=Join-Path $env:RUNNER_TEMP 'tlauncher-native-trial-ci-contract'
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $profile '.tlauncher-native-trial'),"tlauncher-native isolated profile v1`n")
          $env:TLAUNCHER_NATIVE_TRIAL_DIR=$profile
          New-Item -ItemType Directory -Force native-build/assets | Out-Null
          Copy-Item assets/widget native-build/assets -Recurse -Force
          & ./native-build/native-contract.exe ./native-evidence
          if ($LASTEXITCODE -ne 0) {throw "Native lifecycle contract failed: $LASTEXITCODE"}
          ./tests/native-runtime-smoke.ps1 -Exe (Resolve-Path native-build/TLauncher.exe).Path -Evidence (Resolve-Path native-evidence).Path
      - uses: actions/download-artifact@v4
        if: (github.ref == 'refs/heads/codex/native-wallpaper-reengineering-v1.0.3' || github.ref == 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3')
        with:
          name: native-wallpaper-assets
          path: native-build/wallpaper
      - name: Restore hosted-only software GL for full executable verification
        if: (github.ref == 'refs/heads/codex/native-wallpaper-reengineering-v1.0.3' || github.ref == 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3')
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wallpaper-mesa
          key: hosted-mesa-26.3.1-64e84cf13d67dd35
          fail-on-cache-miss: true
      - name: Verify customized migrated profile through normal product startup and restart
        if: github.ref == 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3'
        shell: pwsh
        run: ./tests/native-migrated-runtime.ps1 -Exe (Resolve-Path native-build/TLauncher.exe).Path -Evidence (Resolve-Path native-evidence).Path -Mesa (Join-Path $env:RUNNER_TEMP 'wallpaper-mesa')
      - name: Compare accepted baseline with native wallpaper disabled and enabled
        if: (github.ref == 'refs/heads/codex/native-wallpaper-reengineering-v1.0.3' || github.ref == 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/wallpaper-native-integration.ps1 -Exe (Resolve-Path native-build/TLauncher.exe).Path -Evidence (Resolve-Path native-evidence).Path -Mesa (Join-Path $env:RUNNER_TEMP 'wallpaper-mesa')
      - name: Build and verify on-demand native capture tools
        if: github.ref == 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3'
        shell: pwsh
        run: |
          cargo test --release --locked --bin TLauncherCapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --bin TLauncherCapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/TLauncherCapture.exe native-build/
      - name: Package immutable Native Base TEST
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='TLauncher-Native-1.0.3-${{ github.sha }}-win-x64'
          $dir=Join-Path 'dist' $name
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item native-build/TLauncher.exe $dir
          if ('${{ github.ref }}' -eq 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3') {
            Copy-Item native-build/TLauncherCapture.exe $dir
          }
          New-Item -ItemType Directory -Path (Join-Path $dir assets) -Force | Out-Null
          Copy-Item assets/widget (Join-Path $dir assets) -Recurse
          Copy-Item native-build/runtime-licenses (Join-Path $dir 'runtime-licenses') -Recurse
          if (Test-Path native-build/wallpaper) {
            Copy-Item native-build/wallpaper (Join-Path $dir 'wallpaper') -Recurse
            'PHASE_2_WALLPAPER' | Set-Content (Join-Path $dir 'PACKAGE-KIND.txt') -Encoding ascii
          }
          foreach ($file in 'LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','TRADEMARKS.md') {Copy-Item $file $dir}
          Copy-Item native/fluidwin/LICENSE (Join-Path $dir 'FLUIDWIN-LICENSE.txt')
          Copy-Item native/fluidwin/PROVENANCE.json $dir
          Copy-Item docs/NATIVE_BASE_UAT.md (Join-Path $dir 'NATIVE-BASE-UAT.md')
          if (Test-Path native-build/wallpaper) {
            Copy-Item docs/WALLPAPER_UAT.md (Join-Path $dir 'WALLPAPER-UAT.md')
            Copy-Item docs/WALLPAPER_REENGINEERING.md (Join-Path $dir 'WALLPAPER-ARCHITECTURE.md')
            Copy-Item docs/WALLPAPER_LAYER_AUDIT.md (Join-Path $dir 'WALLPAPER_LAYER_AUDIT.md')
          }
          Copy-Item tools/native-owner-uat.ps1 $dir
          Copy-Item tools/native-profile-library.ps1 $dir
          if ('${{ github.ref }}' -eq 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3') {'PHASE_3_STAGE_SPOTLIGHT' | Set-Content (Join-Path $dir 'PACKAGE-KIND.txt') -Encoding ascii; Copy-Item docs/PHASE3_UAT.md (Join-Path $dir 'STAGE-SPOTLIGHT-UAT.md')}
          Copy-Item tools/legacy-uat-library.ps1 $dir
          Copy-Item tools/native-resource-diagnostics.ps1,tools/native-resource-summary.ps1 $dir
          Copy-Item tools/NATIVE-RESOURCE.cmd $dir
          '1.0.3' | Set-Content (Join-Path $dir 'VERSION.txt') -Encoding ascii
          '${{ github.sha }}' | Set-Content (Join-Path $dir 'BUILD-COMMIT.txt') -Encoding ascii
          '2f773a8733b84c7dbee88fff6628d14e9ac802b9' | Set-Content (Join-Path $dir 'UPSTREAM-COMMIT.txt') -Encoding ascii
          if ((Get-Item (Join-Path $dir 'TLauncher.exe')).VersionInfo.ProductVersion -cne '1.0.3') {throw 'Wrong PE version'}
          Compress-Archive -LiteralPath $dir -DestinationPath "dist/$name.zip"
          $hash=(Get-FileHash "dist/$name.zip").Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: TLauncher-Native-Base-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-base-evidence
          path: native-evidence/
          retention-days: 30
          if-no-files-found: warn
  wallpaper-contract:
    if: (github.ref == 'refs/heads/codex/native-wallpaper-reengineering-v1.0.3' || github.ref == 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact hosted wallpaper verification
        id: wallpaper-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            wallpaper-evidence/wallpaper
            wallpaper-evidence/*.txt
            wallpaper-evidence/*.log
            wallpaper-evidence/*.png
            wallpaper-evidence/verification-origin.json
          key: native-wallpaper-verified-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/wallpaper/**','native/fluidwin/pool.h','native/fluidwin/tlauncher_identity.h','tests/wallpaper-contract.cpp','tests/wallpaper-renderer.cpp','tools/stage-wallpaper-assets.ps1','assets/shaders/**','prototype/*.frag','prototype/assets/*.png','.github/workflows/build-rust-test.yml') }}
      - uses: msys2/setup-msys2@v2
        if: steps.wallpaper-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile native wallpaper ownership and topology contracts
        if: steps.wallpaper-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p wallpaper-evidence
          g++ -O2 -std=gnu++20 -Wall -DUNICODE -D_UNICODE -DNOMINMAX tests/wallpaper-contract.cpp -o wallpaper-evidence/wallpaper-contract.exe -lopengl32 -lgdi32 -luser32 -lole32 -loleaut32 -luuid -static
          g++ -O2 -std=gnu++20 -Wall -DUNICODE -D_UNICODE -DNOMINMAX tests/wallpaper-renderer.cpp -o wallpaper-evidence/wallpaper-renderer.exe -lopengl32 -lgdi32 -luser32 -lole32 -loleaut32 -luuid -lwindowscodecs -ldwmapi -ld3d11 -ldxgi -ldcomp -static
      - name: Verify native configuration, physical topology and solar contracts
        if: steps.wallpaper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & ./wallpaper-evidence/wallpaper-contract.exe 2>&1 | Tee-Object wallpaper-evidence/contracts.txt
          if ($LASTEXITCODE -ne 0) { throw 'Wallpaper contracts failed' }
      - name: Stage only audited graphics assets for hosted visual verification
        if: steps.wallpaper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/stage-wallpaper-assets.ps1 -Destination wallpaper-evidence
      - name: Cache pinned software GL solely for hosted verification
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wallpaper-mesa
          key: hosted-mesa-26.3.1-64e84cf13d67dd35
      - name: Retrieve checksum-verified hosted software GL
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'mesa-hosted.7z'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.3.1/mesa3d-26.3.1-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash $archive).Hash.ToLowerInvariant() -cne '64e84cf13d67dd354640bf443ed0445e6a83afd06a5729f0750b3744d633b3f1') {throw 'Hosted Mesa checksum mismatch'}
          & 7z x -y $archive ('-o'+(Join-Path $env:RUNNER_TEMP 'wallpaper-mesa'))
          if ($LASTEXITCODE -ne 0) {throw 'Hosted Mesa extraction failed'}
      - name: Render all native scenes and verify panorama pixels
        if: steps.wallpaper-cache.outputs.cache-hit != 'true'
        id: wallpaper-render
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wallpaper-mesa/x64/*.dll') wallpaper-evidence
          $env:GALLIUM_DRIVER='llvmpipe'
          $env:LIBGL_ALWAYS_SOFTWARE='true'
          & ./wallpaper-evidence/wallpaper-renderer.exe wallpaper-evidence 2>&1 | Tee-Object wallpaper-evidence/renderer.log
          if ($LASTEXITCODE -ne 0) {throw 'Native scene/panorama verification failed'}
          ./tools/stage-wallpaper-assets.ps1 -Destination wallpaper-evidence
      - name: Record exact renderer verification origin
        if: steps.wallpaper-cache.outputs.cache-hit != 'true' && steps.wallpaper-render.outcome == 'success'
        shell: pwsh
        run: |
          @{passed=$true;commit='${{ github.sha }}';run='${{ github.run_id }}';key='${{ steps.wallpaper-cache.outputs.cache-primary-key }}';mesaSha256='64e84cf13d67dd354640bf443ed0445e6a83afd06a5729f0750b3744d633b3f1'} | ConvertTo-Json | Set-Content wallpaper-evidence/verification-origin.json -Encoding utf8
      - name: Retain exact successful renderer evidence
        if: steps.wallpaper-cache.outputs.cache-hit != 'true' && steps.wallpaper-render.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            wallpaper-evidence/wallpaper
            wallpaper-evidence/*.txt
            wallpaper-evidence/*.log
            wallpaper-evidence/*.png
            wallpaper-evidence/verification-origin.json
          key: ${{ steps.wallpaper-cache.outputs.cache-primary-key }}
      - name: Identify reused renderer evidence
        if: steps.wallpaper-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $origin=Get-Content wallpaper-evidence/verification-origin.json -Raw | ConvertFrom-Json
          if(!$origin.passed -or $origin.key -cne '${{ steps.wallpaper-cache.outputs.cache-primary-key }}'){throw 'Renderer verification cache identity mismatch'}
          @{currentCommit='${{ github.sha }}';currentRun='${{ github.run_id }}';origin=$origin} | ConvertTo-Json -Depth 4 | Set-Content wallpaper-evidence/verification-reused.json -Encoding utf8
          Write-Host "Reusing unchanged renderer inputs verified by run $($origin.run), commit $($origin.commit). Exact candidate native integration still runs."
      - uses: actions/upload-artifact@v4
        with:
          name: native-wallpaper-assets
          path: wallpaper-evidence/wallpaper/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallpaper-reengineering-evidence
          path: |
            wallpaper-evidence/*.txt
            wallpaper-evidence/*.log
            wallpaper-evidence/*.png
            wallpaper-evidence/verification-*.json
          retention-days: 30
  build-rust:
    if: github.ref != 'refs/heads/codex/fluidwin-native-base-v1.0.3' && github.ref != 'refs/heads/codex/native-wallpaper-reengineering-v1.0.3' && github.ref != 'refs/heads/codex/native-stage-spotlight-reengineering-v1.0.3'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'none'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore hosted Rust dependency/build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-tlauncher-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-tlauncher-v1-${{ hashFiles('Cargo.lock') }}-

      - name: Compile native app and fixtures on hosted runner
        id: native-compile
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --release --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify original standalone volume feedback without audio changes
        if: ${{ !cancelled() && steps.native-compile.outcome == 'success' }}
        run: |
          $env:TUANPC_DESK_STAGE_EVIDENCE = Join-Path $env:RUNNER_TEMP 'stage-fixture-evidence'
          New-Item -ItemType Directory -Force -Path $env:TUANPC_DESK_STAGE_EVIDENCE | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $env:TUANPC_DESK_STAGE_EVIDENCE 'early-source.txt')
          cargo test --release dock::volume_osd::tests::native_volume_osd_displays_confirmed_values_without_audio_or_input -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $env:TUANPC_DESK_STAGE_EVIDENCE 'early-osd.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::battery_notices::tests::native_power_subscriptions_release_without_power_policy_writes -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $env:TUANPC_DESK_STAGE_EVIDENCE 'early-osd.log') -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::headphone_notices::tests::native_endpoint_events_release_and_refuse_stale_notice_delivery -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $env:TUANPC_DESK_STAGE_EVIDENCE 'early-osd.log') -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify original static snapshots and bounded hung-source ownership
        if: ${{ !cancelled() && steps.native-compile.outcome == 'success' }}
        run: |
          $env:TUANPC_DESK_STAGE_EVIDENCE = Join-Path $env:RUNNER_TEMP 'stage-fixture-evidence'
          New-Item -ItemType Directory -Force -Path $env:TUANPC_DESK_STAGE_EVIDENCE | Out-Null
          $staticFailed = $false
          foreach ($fixture in 'native_static_photos_keep_original_pixels_and_reject_unsafe_sources','native_static_print_timeout_keeps_one_job_until_native_completion') {
            cargo test --release "dock::stage_capture_lab::$fixture" -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $env:TUANPC_DESK_STAGE_EVIDENCE 'early-static.log') -Append
            if ($LASTEXITCODE -ne 0) { $staticFailed = $true }
          }
          if ($staticFailed) { exit 1 }

      - name: Upload early native diagnostics before the full regression suite
        if: ${{ !cancelled() && steps.native-compile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-static-osd-early
          path: |
            ${{ runner.temp }}/stage-fixture-evidence/early-*.log
            ${{ runner.temp }}/stage-fixture-evidence/early-source.txt
